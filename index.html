  const ref = e.target.closest('.mod-ref');
  if (ref) _modTT.style.display = 'none';
});

// === MAP RENDERING ===
async function loadMapAssets() {
  if (mapBaseImg) return; // already loaded
  const v = '3';
  const [baseImg, idImg, bounds] = await Promise.all([
    new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = 'map_base.png?v='+v; }),
    new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = 'province_id_map.png?v='+v; }),
    fetch('province_bounds.json?v='+v).then(r => r.json()),
  ]);
  mapBaseImg = baseImg;
  mapIdImg = idImg;
  mapBounds = bounds;
  // Extract ID pixel data into offscreen canvas
  const oc = document.createElement('canvas');
  oc.width = MAP_W; oc.height = MAP_H;
  const octx = oc.getContext('2d');
  octx.drawImage(idImg, 0, 0);
  mapIdData = octx.getImageData(0, 0, MAP_W, MAP_H).data;
}

async function renderMap(tag) {
  const container = document.getElementById('map-container');
  const canvas = document.getElementById('map-canvas');
  if (!container || !canvas) return;

  const cw = container.clientWidth, ch = container.clientHeight;
  canvas.width = cw; canvas.height = ch;
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#0e1420'; ctx.fillRect(0, 0, cw, ch);
  ctx.fillStyle = '#9e9eb0'; ctx.font = '16px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('Loading map...', cw/2, ch/2);

  await loadMapAssets();

  canvas.width = MAP_W; canvas.height = MAP_H;
  const fitScale = cw / MAP_W;
  canvas.style.width = cw + 'px';
  canvas.style.height = Math.round(MAP_H * fitScale) + 'px';

  const ctx2 = canvas.getContext('2d');
  ctx2.drawImage(mapBaseImg, 0, 0);

  const provIds = PROVINCE_OWNERS[tag] || [];
  const c = DATA[tag];
  const color = c && c.color ? c.color : [201, 168, 76];
  const hr = color[0], hg = color[1], hb = color[2];
  const provSet = new Set(provIds);

  // Collect subject province IDs
  const diplo = DIPLOMACY[tag] || {};
  const subjectProvs = new Set();
  const subjectColors = {};
  if (diplo.overlord_of) {
    diplo.overlord_of.forEach(s => {
      const sProvs = PROVINCE_OWNERS[s.tag] || [];
      const sc = DATA[s.tag];
      const sColor = sc && sc.color ? sc.color : [100, 100, 150];
      sProvs.forEach(p => { subjectProvs.add(p); subjectColors[p] = sColor; });
    });
  }

  // All provinces to consider for zoom bounds
  const allRelevantProvs = [...provIds];
  subjectProvs.forEach(p => allRelevantProvs.push(p));

  const imgData = ctx2.getImageData(0, 0, MAP_W, MAP_H);
  const pixels = imgData.data;

  // Dim entire map
  for (let i = 0; i < pixels.length; i += 4) {
    pixels[i] = Math.floor(pixels[i] * 0.3);
    pixels[i+1] = Math.floor(pixels[i+1] * 0.3);
    pixels[i+2] = Math.floor(pixels[i+2] * 0.3);
  }

  // Highlight subject provinces (slightly dimmer, with striped pattern)
  for (const pid of subjectProvs) {
    if (provSet.has(pid)) continue; // skip if also owned by main country
    const b = mapBounds[String(pid)];
    if (!b) continue;
    const sc = subjectColors[pid] || [100, 100, 150];
    const [x1, y1, x2, y2] = b;
    for (let y = y1; y <= y2; y++) {
      for (let x = x1; x <= x2; x++) {
        const idx = (y * MAP_W + x) * 4;
        const provIdHere = (mapIdData[idx] << 8) | mapIdData[idx + 1];
        if (subjectProvs.has(provIdHere) && !provSet.has(provIdHere)) {
          // Slightly dimmer than main, with diagonal stripe pattern
          const stripe = (x + y) % 6 < 3;
          const factor = stripe ? 0.7 : 0.5;
          pixels[idx] = Math.min(255, Math.floor(sc[0] * factor) + 40);
          pixels[idx+1] = Math.min(255, Math.floor(sc[1] * factor) + 40);
          pixels[idx+2] = Math.min(255, Math.floor(sc[2] * factor) + 40);
          pixels[idx+3] = 255;
        }
      }
    }
  }

  // Highlight main country provinces brightly
  for (const pid of provIds) {
    const b = mapBounds[String(pid)];
    if (!b) continue;
    const [x1, y1, x2, y2] = b;
    for (let y = y1; y <= y2; y++) {
      for (let x = x1; x <= x2; x++) {
        const idx = (y * MAP_W + x) * 4;
        const provIdHere = (mapIdData[idx] << 8) | mapIdData[idx + 1];
        if (provSet.has(provIdHere)) {
          pixels[idx] = Math.min(255, hr + 60);
          pixels[idx+1] = Math.min(255, hg + 60);
          pixels[idx+2] = Math.min(255, hb + 60);
          pixels[idx+3] = 255;
        }
      }
    }
  }

  // Borders: outer (white), internal province (dark), main-vs-subject (gold)
  const allHighlighted = new Set([...provSet, ...subjectProvs]);
  const borderPixels = new Uint8ClampedArray(pixels);
  for (const pid of allHighlighted) {
    const b = mapBounds[String(pid)];
    if (!b) continue;
    const [x1, y1, x2, y2] = b;
    for (let y = y1; y <= y2; y++) {
      for (let x = x1; x <= x2; x++) {
        const idx = (y * MAP_W + x) * 4;
        const provIdHere = (mapIdData[idx] << 8) | mapIdData[idx + 1];
        if (provIdHere !== pid) continue; // only process pixels belonging to this province
        for (const [dx, dy] of [[-1,0],[1,0],[0,-1],[0,1]]) {
          const nx = x+dx, ny = y+dy;
          if (nx < 0 || nx >= MAP_W || ny < 0 || ny >= MAP_H) {
            // Edge of map = outer border
            borderPixels[idx] = 255; borderPixels[idx+1] = 255; borderPixels[idx+2] = 255; borderPixels[idx+3] = 255;
            break;
          }
          const ni = (ny * MAP_W + nx) * 4;
          const nid = (mapIdData[ni] << 8) | mapIdData[ni+1];
          if (nid === provIdHere) continue; // same province, no border
          if (!allHighlighted.has(nid)) {
            // Outer border: white
            borderPixels[idx] = 255; borderPixels[idx+1] = 255; borderPixels[idx+2] = 255; borderPixels[idx+3] = 255;
            break;
          }
          // Border between main country and subject: gold dashed
          const thisIsMain = provSet.has(provIdHere);
          const neighborIsMain = provSet.has(nid);
          if (thisIsMain !== neighborIsMain) {
            if ((x + y) % 4 < 2) {
              borderPixels[idx] = 201; borderPixels[idx+1] = 168; borderPixels[idx+2] = 76; borderPixels[idx+3] = 255;
            }
            break;
          }
          // Internal province border within same realm: darken
          const r0 = borderPixels[idx], g0 = borderPixels[idx+1], b0 = borderPixels[idx+2];
          borderPixels[idx] = Math.floor(r0 * 0.55);
          borderPixels[idx+1] = Math.floor(g0 * 0.55);
          borderPixels[idx+2] = Math.floor(b0 * 0.55);
          break;
        }
      }
    }
  }
  imgData.data.set(borderPixels);
  ctx2.putImageData(imgData, 0, 0);

  // Save rendered state for province click restore
  mapRenderedData = new Uint8ClampedArray(borderPixels);
  mapCurrentTag = tag;

  // Add legend if subjects exist
  const existingLegend = container.querySelector('.map-legend');
  if (existingLegend) existingLegend.remove();
  if (subjectProvs.size > 0) {
    const legend = document.createElement('div');
    legend.className = 'map-legend';
    legend.innerHTML = `<div class="map-legend-item"><div class="map-legend-swatch" style="background:rgb(${hr+60},${hg+60},${hb+60})"></div> ${esc(c.name)}</div>`;
    if (diplo.overlord_of) {
      diplo.overlord_of.forEach(s => {
        const sn = DATA[s.tag] ? DATA[s.tag].name : s.tag;
        const sc = DATA[s.tag] && DATA[s.tag].color ? DATA[s.tag].color : [100,100,150];
        legend.innerHTML += `<div class="map-legend-item"><div class="map-legend-swatch" style="background:rgb(${Math.floor(sc[0]*0.7)+40},${Math.floor(sc[1]*0.7)+40},${Math.floor(sc[2]*0.7)+40})"></div> ${esc(sn)} (${esc(s.type_name)})</div>`;
      });
    }
    container.appendChild(legend);
  }

  // Auto-zoom to fit
  let minX = MAP_W, minY = MAP_H, maxX = 0, maxY = 0;
  for (const pid of allRelevantProvs) {
    const b = mapBounds[String(pid)];
    if (!b) continue;
    minX = Math.min(minX, b[0]); minY = Math.min(minY, b[1]);
    maxX = Math.max(maxX, b[2]); maxY = Math.max(maxY, b[3]);
  }
  const pw = maxX - minX, ph = maxY - minY;
  const centerX = (minX + maxX) / 2, centerY = (minY + maxY) / 2;
  const pad = 1.8;
  // Cap was 8, but combined with fitScale (~0.23 for full-width container)
  // that gave only ~1.8x effective zoom — tiny 1-province nations like P22
  // Anatu'āgao or the M-block Polynesia tags rendered as ~30px specks.
  // Bumping to 30 lets a single small province actually fill its frame.
  mapScale = Math.min(cw / (pw * fitScale * pad), ch / (ph * fitScale * pad), 30);
  mapScale = Math.max(mapScale, 1);
  mapOffX = cw/2 - centerX * fitScale * mapScale;
  mapOffY = ch/2 - centerY * fitScale * mapScale;
  applyMapTransform();

  setupMapInteraction(container, canvas);
}

function applyMapTransform() {
  const canvas = document.getElementById('map-canvas');
  if (!canvas) return;
  canvas.style.transformOrigin = '0 0';
  canvas.style.transform = `translate(${mapOffX}px, ${mapOffY}px) scale(${mapScale})`;
}

function mapZoom(dir) {
  const container = document.getElementById('map-container');
  if (!container) return;
  const cw = container.clientWidth, ch = container.clientHeight;
  const cx = cw/2, cy = ch/2;
  const factor = dir > 0 ? 1.3 : 1/1.3;
  const newScale = Math.max(0.5, Math.min(10, mapScale * factor));
  mapOffX = cx - (cx - mapOffX) * (newScale / mapScale);
  mapOffY = cy - (cy - mapOffY) * (newScale / mapScale);
  mapScale = newScale;
  applyMapTransform();
}

function mapReset() {
  if (mapCurrentTag) renderMap(mapCurrentTag);
}

let _mapHandlersContainer = null;
function getMapProvAtCoord(mx, my) {
  const fitScale = document.getElementById('map-container').clientWidth / MAP_W;
  const mapX = Math.floor((mx - mapOffX) / (mapScale * fitScale));
  const mapY = Math.floor((my - mapOffY) / (mapScale * fitScale));
  if (mapX < 0 || mapX >= MAP_W || mapY < 0 || mapY >= MAP_H) return 0;
  const idx = (mapY * MAP_W + mapX) * 4;
  return (mapIdData[idx] << 8) | mapIdData[idx+1];
}

function highlightProvince(pid) {
  const canvas = document.getElementById('map-canvas');
  const ctx = canvas.getContext('2d');
  if (!mapRenderedData) return;
  // Restore base rendered state
  const imgData = ctx.createImageData(MAP_W, MAP_H);
  imgData.data.set(mapRenderedData);
  // Highlight the clicked province
  const b = mapBounds[String(pid)];
  if (b) {
    const [x1, y1, x2, y2] = b;
    for (let y = y1; y <= y2; y++) {
      for (let x = x1; x <= x2; x++) {
        const idx = (y * MAP_W + x) * 4;
        const provIdHere = (mapIdData[idx] << 8) | mapIdData[idx + 1];
        if (provIdHere === pid) {
          // Bright yellow-white highlight
          imgData.data[idx] = 255;
          imgData.data[idx+1] = 240;
          imgData.data[idx+2] = 180;
          imgData.data[idx+3] = 255;
        }
      }
    }
    // Border for highlighted province
    for (let y = y1; y <= y2; y++) {
      for (let x = x1; x <= x2; x++) {
        const idx = (y * MAP_W + x) * 4;
        const provIdHere = (mapIdData[idx] << 8) | mapIdData[idx + 1];
        if (provIdHere !== pid) continue;
        for (const [dx, dy] of [[-1,0],[1,0],[0,-1],[0,1]]) {
          const nx = x+dx, ny = y+dy;
          if (nx < 0 || nx >= MAP_W || ny < 0 || ny >= MAP_H) continue;
          const ni = (ny * MAP_W + nx) * 4;
          const nid = (mapIdData[ni] << 8) | mapIdData[ni+1];
          if (nid !== pid) {
            imgData.data[idx] = 255; imgData.data[idx+1] = 215; imgData.data[idx+2] = 0; imgData.data[idx+3] = 255;
            break;
          }
        }
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function showProvincePanel(pid) {
  const panel = document.getElementById('map-province-panel');
  if (!panel) return;
  const name = PROVINCES[String(pid)] || ('Province ' + pid);
  const d = PROV_DETAILS[String(pid)] || {};
  const tax = d.t || 0, prod = d.p || 0, man = d.m || 0;
  const totalDev = tax + prod + man;
  const tg = d.g ? d.g.replace(/_/g, ' ') : 'Unknown';
  const culture = d.c ? d.c.replace(/_/g, ' ') : 'Unknown';
  const religion = d.r ? d.r.replace(/_/g, ' ') : 'Unknown';
  const owner = d.o ? (DATA[d.o] ? DATA[d.o].name : d.o) : 'Uncolonized';

  let html = `<div class="prov-name">${esc(name)}</div>`;
  html += `<div class="prov-row"><span class="prov-label">Owner</span><span class="prov-val">${esc(owner)}</span></div>`;
  html += `<div class="prov-row"><span class="prov-label">Development</span><span class="prov-val prov-dev">${totalDev} (${tax}/${prod}/${man})</span></div>`;
  html += `<div class="prov-row"><span class="prov-label">Trade Good</span><span class="prov-val">${esc(titleCase(tg))}</span></div>`;
  html += `<div class="prov-row"><span class="prov-label">Culture</span><span class="prov-val">${esc(titleCase(culture))}</span></div>`;
  html += `<div class="prov-row"><span class="prov-label">Religion</span><span class="prov-val">${esc(titleCase(religion))}</span></div>`;

  panel.innerHTML = html;
  panel.style.display = 'block';
}

function setupMapInteraction(container, canvas) {
  // If handlers are on the same DOM element, skip
  if (_mapHandlersContainer === container) return;
  _mapHandlersContainer = container;
  let dragging = false, lastX, lastY, didDrag = false;

  container.addEventListener('mousedown', (e) => {
    dragging = true; didDrag = false;
    lastX = e.clientX; lastY = e.clientY;
    container.style.cursor = 'grabbing';
  });
  container.addEventListener('mousemove', (e) => {
    if (dragging) {
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) didDrag = true;
      mapOffX += dx; mapOffY += dy;
      lastX = e.clientX; lastY = e.clientY;
      applyMapTransform();
    } else if (mapIdData) {
      const rect = container.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const pid = getMapProvAtCoord(mx, my);
      const tt = document.getElementById('map-tooltip');
      if (pid > 0 && PROVINCES[String(pid)]) {
        const d = PROV_DETAILS[String(pid)];
        const dev = d ? `${(d.t||0)+(d.p||0)+(d.m||0)} dev` : '';
        tt.textContent = PROVINCES[String(pid)] + (dev ? ' \u2022 ' + dev : '');
        tt.style.display = 'block';
        tt.style.left = (mx + 12) + 'px';
        tt.style.top = (my - 8) + 'px';
      } else {
        tt.style.display = 'none';
      }
    }
  });
  container.addEventListener('mouseup', () => {
    dragging = false;
    container.style.cursor = 'grab';
  });

  // Province click
  container.addEventListener('click', (e) => {
    if (didDrag) return;
    const rect = container.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const pid = getMapProvAtCoord(mx, my);
    if (pid > 0 && PROV_DETAILS[String(pid)]) {
      highlightProvince(pid);
      showProvincePanel(pid);
    } else {
      const panel = document.getElementById('map-province-panel');
      if (panel) panel.style.display = 'none';
      if (mapRenderedData) {
        const c = document.getElementById('map-canvas');
        const ctx = c.getContext('2d');
        const imgData = ctx.createImageData(MAP_W, MAP_H);
        imgData.data.set(mapRenderedData);
        ctx.putImageData(imgData, 0, 0);
      }
    }
  });

  addPinchZoom(container, {
    min: 0.5, max: 10,
    getScale: () => mapScale,
    getOff: () => [mapOffX, mapOffY],
    set: (s, x, y) => { mapScale = s; mapOffX = x; mapOffY = y; applyMapTransform(); }
  });

  container.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = container.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
    const newScale = Math.max(0.5, Math.min(10, mapScale * factor));
    mapOffX = mx - (mx - mapOffX) * (newScale / mapScale);
    mapOffY = my - (my - mapOffY) * (newScale / mapScale);
    mapScale = newScale;
    applyMapTransform();
  }, { passive: false });

  container.addEventListener('mouseleave', () => {
    document.getElementById('map-tooltip').style.display = 'none';
  });
}

// Hook: when map tab is activated, render the map
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn[data-tab="map"]');
  if (btn) {
    const tag = document.getElementById('detail')?.dataset?.tag;
    if (tag) setTimeout(() => renderMap(tag), 50);
  }
});

// === GEO-REF MINI-MAP TOOLTIP ===
const geoTT = document.getElementById('geo-tooltip');
const geoCanvas = document.getElementById('geo-canvas');
const geoLabel = geoTT.querySelector('.geo-label');
let geoBaseCanvas = null; // cached offscreen base map

async function ensureGeoBase() {
  if (geoBaseCanvas) return;
  await loadMapAssets();
  geoBaseCanvas = document.createElement('canvas');
  geoBaseCanvas.width = MAP_W;
  geoBaseCanvas.height = MAP_H;
  geoBaseCanvas.getContext('2d').drawImage(mapBaseImg, 0, 0);
}

function getGeoProvIds(el) {
  // Single province
  if (el.dataset.provs) return el.dataset.provs.split(',').map(Number).filter(Boolean);
  // Area
  if (el.dataset.area) {
    const areas = AREA_DATA.areas || {};
    return areas[el.dataset.area] || [];
  }
  // Region
  if (el.dataset.region) {
    const regions = AREA_DATA.regions || {};
    return regions[el.dataset.region] || [];
  }
  return [];
}

function renderGeoTooltip(provIds, mouseX, mouseY) {
  if (!provIds.length || !mapBounds || !mapIdData) { geoTT.style.display = 'none'; return; }

  // Compute bounding box of all provinces
  let minX = MAP_W, minY = MAP_H, maxX = 0, maxY = 0;
  const validIds = [];
  for (const pid of provIds) {
    const b = mapBounds[String(pid)];
    if (!b) continue;
    validIds.push(pid);
    minX = Math.min(minX, b[0]);
    minY = Math.min(minY, b[1]);
    maxX = Math.max(maxX, b[2]);
    maxY = Math.max(maxY, b[3]);
  }
  if (!validIds.length) { geoTT.style.display = 'none'; return; }

  // Add padding around the bounding box
  const pad = 60;
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const spanX = maxX - minX + pad * 2, spanY = maxY - minY + pad * 2;
  // Choose crop size — at least 200px, at most 600px of map space
  const cropSize = Math.max(200, Math.min(600, Math.max(spanX, spanY)));
  const cropX = Math.max(0, Math.min(MAP_W - cropSize, cx - cropSize / 2));
  const cropY = Math.max(0, Math.min(MAP_H - cropSize, cy - cropSize / 2));

  // Canvas display size
  const DISPLAY = 280;
  geoCanvas.width = DISPLAY;
  geoCanvas.height = DISPLAY;
  const gctx = geoCanvas.getContext('2d');

  // Draw cropped base map
  gctx.drawImage(geoBaseCanvas, cropX, cropY, cropSize, cropSize, 0, 0, DISPLAY, DISPLAY);

  // Dim everything slightly
  gctx.fillStyle = 'rgba(0,0,0,0.35)';
  gctx.fillRect(0, 0, DISPLAY, DISPLAY);

  // Highlight target provinces
  const scale = DISPLAY / cropSize;
  const baseData = geoBaseCanvas.getContext('2d').getImageData(cropX, cropY, Math.ceil(cropSize), Math.ceil(cropSize));
  const imgData = gctx.getImageData(0, 0, DISPLAY, DISPLAY);
  const pidSet = new Set(validIds);

  for (const pid of validIds) {
    const b = mapBounds[String(pid)];
    if (!b) continue;
    // Map bounds to crop coordinates
    const bx1 = Math.max(0, b[0] - cropX), by1 = Math.max(0, b[1] - cropY);
    const bx2 = Math.min(cropSize - 1, b[2] - cropX), by2 = Math.min(cropSize - 1, b[3] - cropY);

    for (let y = by1; y <= by2; y++) {
      for (let x = bx1; x <= bx2; x++) {
        // Check province ID at this pixel
        const mapX = Math.floor(cropX + x), mapY = Math.floor(cropY + y);
        if (mapX < 0 || mapX >= MAP_W || mapY < 0 || mapY >= MAP_H) continue;
        const midx = (mapY * MAP_W + mapX) * 4;
        const pixPid = (mapIdData[midx] << 8) | mapIdData[midx + 1];
        if (!pidSet.has(pixPid)) continue;

        // Map to display coordinates
        const dx = Math.floor(x * scale), dy = Math.floor(y * scale);
        if (dx >= DISPLAY || dy >= DISPLAY) continue;
        const didx = (dy * DISPLAY + dx) * 4;

        // Brighten the original color
        const sx = Math.floor(x), sy = Math.floor(y);
        if (sx >= 0 && sx < baseData.width && sy >= 0 && sy < baseData.height) {
          const sidx = (sy * baseData.width + sx) * 4;
          imgData.data[didx] = Math.min(255, baseData.data[sidx] + 80);
          imgData.data[didx + 1] = Math.min(255, baseData.data[sidx + 1] + 60);
          imgData.data[didx + 2] = Math.min(255, baseData.data[sidx + 2]);
          imgData.data[didx + 3] = 255;
        }
      }
    }
  }
  gctx.putImageData(imgData, 0, 0);

  // Draw a gold border around the highlighted area
  gctx.strokeStyle = 'rgba(212,175,55,0.7)';
  gctx.lineWidth = 2;
  const hlX = (minX - pad/2 - cropX) * scale, hlY = (minY - pad/2 - cropY) * scale;
  const hlW = (maxX - minX + pad) * scale, hlH = (maxY - minY + pad) * scale;
  gctx.strokeRect(hlX, hlY, hlW, hlH);

  // Position tooltip near mouse
  const ttW = DISPLAY + 2, ttH = DISPLAY + 28;
  let tx = mouseX + 16, ty = mouseY - ttH / 2;
  if (tx + ttW > window.innerWidth - 10) tx = mouseX - ttW - 16;
  if (ty < 10) ty = 10;
  if (ty + ttH > window.innerHeight - 10) ty = window.innerHeight - ttH - 10;
  geoTT.style.left = tx + 'px';
  geoTT.style.top = ty + 'px';
  geoTT.style.display = 'block';
}

let geoHoverEl = null;
let geoLoadingTimer = null;

document.addEventListener('mouseenter', async (e) => {
  if (!(e.target instanceof Element)) return;
  const ref = e.target.closest('.geo-ref');
  if (!ref) return;
  geoHoverEl = ref;
  // Small delay to avoid flashing on quick mouse pass
  clearTimeout(geoLoadingTimer);
  geoLoadingTimer = setTimeout(async () => {
    if (geoHoverEl !== ref) return;
    await ensureGeoBase();
    const provIds = getGeoProvIds(ref);
    if (!provIds.length) return;
    // Build label
    let label = '';
    if (ref.dataset.provs && provIds.length === 1) label = provName(provIds[0]) + ' (Province ' + provIds[0] + ')';
    else if (ref.dataset.area) label = ref.dataset.area.replace(/_area$/, '').replace(/_/g, ' ') + ' (' + provIds.length + ' provinces)';
    else if (ref.dataset.region) label = ref.dataset.region.replace(/_region$/, '').replace(/_/g, ' ') + ' (' + provIds.length + ' provinces)';
    geoLabel.textContent = label;
    const rect = ref.getBoundingClientRect();
    renderGeoTooltip(provIds, rect.right, rect.top);
  }, 150);
}, true);

document.addEventListener('mouseleave', (e) => {
  if (!(e.target instanceof Element)) return;
  const ref = e.target.closest('.geo-ref');
  if (ref) {
    geoHoverEl = null;
    clearTimeout(geoLoadingTimer);
    geoTT.style.display = 'none';
  }
}, true);

// === WORLD MAP (welcome overview) ===
let wmScale = 1, wmOffX = 0, wmOffY = 0, wmFitScale = 1;
let wmOwnerByPid = null, wmTags = null, wmTagIndex = null;
let wmColorR = null, wmColorG = null, wmColorB = null;
let wmRendered = false, wmDirty = false, wmTimer = null, wmRendering = false, wmHandlersSet = false;
let wmLandBox = null; // [x1, y1, x2, y2] bounding box of all owned provinces
let wmFocus = null;   // province-density-weighted center — where most countries live

function wmBuildOwnerIndex() {
  if (wmOwnerByPid) return;
  wmTags = Object.keys(PROVINCE_OWNERS);
  wmTagIndex = {};
  wmOwnerByPid = new Int16Array(65536).fill(-1);
  const n = wmTags.length;
  wmColorR = new Uint8Array(n); wmColorG = new Uint8Array(n); wmColorB = new Uint8Array(n);
  let bx1 = MAP_W, by1 = MAP_H, bx2 = 0, by2 = 0;
  let sumX = 0, sumY = 0, nProv = 0;
  wmTags.forEach((tag, i) => {
    wmTagIndex[tag] = i;
    const c = DATA[tag];
    const col = c && c.color ? c.color : [110, 110, 120];
    wmColorR[i] = col[0]; wmColorG[i] = col[1]; wmColorB[i] = col[2];
    const provs = PROVINCE_OWNERS[tag] || [];
    for (let j = 0; j < provs.length; j++) {
      const pid = provs[j];
      if (pid > 0 && pid < 65536) {
        wmOwnerByPid[pid] = i;
        const b = mapBounds && mapBounds[String(pid)];
        if (b) {
          if (b[0] < bx1) bx1 = b[0];
          if (b[1] < by1) by1 = b[1];
          if (b[2] > bx2) bx2 = b[2];
          if (b[3] > by2) by2 = b[3];
          sumX += (b[0] + b[2]) / 2; sumY += (b[1] + b[3]) / 2; nProv++;
        }
      }
    }
  });
  if (bx2 > bx1) {
    wmLandBox = [bx1, by1, bx2, by2];
    if (nProv > 0) wmFocus = [sumX / nProv, sumY / nProv];
  }
}

function wmFilterActive() {
  if (activeFilters.size > 0) return true;
  if (document.getElementById('search-input').value.trim()) return true;
  return ['region-select','culture-select','religion-select','tech-select','gov-select']
    .some(id => document.getElementById(id).value);
}

async function renderWorldMap() {
  const wrap = document.getElementById('world-map-wrap');
  const canvas = document.getElementById('world-map-canvas');
  if (!wrap || !canvas || wmRendering) return;
  wmRendering = true;
  try {
    await loadMapAssets();
    wmBuildOwnerIndex();

    const filtering = wmFilterActive();
    const lit = new Uint8Array(wmTags.length);
    if (filtering) {
      for (const c of filteredCountries) {
        const i = wmTagIndex[c.tag];
        if (i !== undefined) lit[i] = 1;
      }
    } else {
      lit.fill(1);
    }

    canvas.width = MAP_W; canvas.height = MAP_H;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(mapBaseImg, 0, 0);
    const imgData = ctx.getImageData(0, 0, MAP_W, MAP_H);
    const px = imgData.data;
    const id = mapIdData;

    // Color pass: paint every owned province with its country color;
    // when filtering, non-matching countries collapse to dark grey.
    for (let i = 0, n = MAP_W * MAP_H; i < n; i++) {
      const k = i * 4;
      const pid = (id[k] << 8) | id[k + 1];
      const ci = pid > 0 ? wmOwnerByPid[pid] : -1;
      if (ci < 0) {
        // Water / uncolonized: dimmed terrain
        px[k] = (px[k] * 0.7) | 0;
        px[k+1] = (px[k+1] * 0.7) | 0;
        px[k+2] = (px[k+2] * 0.7) | 0;
        continue;
      }
      if (lit[ci]) {
        px[k] = wmColorR[ci]; px[k+1] = wmColorG[ci]; px[k+2] = wmColorB[ci];
      } else {
        const g = (((wmColorR[ci] + wmColorG[ci] + wmColorB[ci]) / 3) * 0.28 + 22) | 0;
        px[k] = g; px[k+1] = g; px[k+2] = g;
      }
      px[k+3] = 255;
    }

    // Border pass: darken pixels whose right/bottom neighbor has a different owner
    for (let y = 0; y < MAP_H; y++) {
      const rowOff = y * MAP_W;
      for (let x = 0; x < MAP_W; x++) {
        const k = (rowOff + x) * 4;
        const pid = (id[k] << 8) | id[k + 1];
        const ci = pid > 0 ? wmOwnerByPid[pid] : -1;
        if (ci < 0) continue;
        let border = false;
        if (x + 1 < MAP_W) {
          const k2 = k + 4;
          const pid2 = (id[k2] << 8) | id[k2 + 1];
          if ((pid2 > 0 ? wmOwnerByPid[pid2] : -1) !== ci) border = true;
        }
        if (!border && y + 1 < MAP_H) {
          const k2 = k + MAP_W * 4;
          const pid2 = (id[k2] << 8) | id[k2 + 1];
          if ((pid2 > 0 ? wmOwnerByPid[pid2] : -1) !== ci) border = true;
        }
        if (border) {
          px[k] = (px[k] * 0.35) | 0;
          px[k+1] = (px[k+1] * 0.35) | 0;
          px[k+2] = (px[k+2] * 0.35) | 0;
        }
      }
    }

    ctx.putImageData(imgData, 0, 0);

    const cw = wrap.clientWidth;
    wmFitScale = cw / MAP_W;
    canvas.style.width = cw + 'px';
    canvas.style.height = Math.round(MAP_H * wmFitScale) + 'px';

    if (!wmRendered) {
      wmResetView();
      wmSetupInteraction(wrap);
      wmRendered = true;
    } else {
      wmApplyTransform();
    }

    const status = document.getElementById('world-map-status');
    if (status) {
      status.textContent = filtering
        ? 'Highlighting ' + filteredCountries.length + ' matching countr' + (filteredCountries.length === 1 ? 'y' : 'ies') + ' — greyed-out nations do not match your filters'
        : 'The known world at game start — click any country to explore it';
    }
    wmDirty = false;
  } finally {
    wmRendering = false;
  }
}

function wmApplyTransform() {
  const canvas = document.getElementById('world-map-canvas');
  if (!canvas) return;
  canvas.style.transformOrigin = '0 0';
  canvas.style.transform = 'translate(' + wmOffX + 'px, ' + wmOffY + 'px) scale(' + wmScale + ')';
}

function wmResetView() {
  const wrap = document.getElementById('world-map-wrap');
  if (!wrap) return;
  const cw = wrap.clientWidth, ch = wrap.clientHeight;
  if (wmLandBox) {
    // Fill the frame height with the inhabited land strip, centered on the
    // densest part of the world; the rest stays reachable by pan/zoom.
    const [x1, y1, x2, y2] = wmLandBox;
    const bh = (y2 - y1) * wmFitScale;
    wmScale = Math.max(1, ch / (bh * 1.02));
    const fx = wmFocus ? wmFocus[0] : (x1 + x2) / 2;
    const fy = wmFocus ? wmFocus[1] : (y1 + y2) / 2;
    // Clamp focus so the viewport stays within the land box where possible
    const viewW = cw / (wmScale * wmFitScale), viewH = ch / (wmScale * wmFitScale);
    const cxm = Math.max(x1 + viewW / 2, Math.min(x2 - viewW / 2, fx));
    const cym = Math.max(y1 + viewH / 2, Math.min(y2 - viewH / 2, fy));
    wmOffX = cw / 2 - cxm * wmFitScale * wmScale;
    wmOffY = ch / 2 - cym * wmFitScale * wmScale;
  } else {
    wmScale = Math.max(1, ch / (MAP_H * wmFitScale));
    wmOffX = (cw - MAP_W * wmFitScale * wmScale) / 2;
    wmOffY = (ch - MAP_H * wmFitScale * wmScale) / 2;
  }
  wmApplyTransform();
}

function wmZoom(dir) {
  const wrap = document.getElementById('world-map-wrap');
  if (!wrap) return;
  const cx = wrap.clientWidth / 2, cy = wrap.clientHeight / 2;
  const factor = dir > 0 ? 1.3 : 1 / 1.3;
  const newScale = Math.max(0.8, Math.min(20, wmScale * factor));
  wmOffX = cx - (cx - wmOffX) * (newScale / wmScale);
  wmOffY = cy - (cy - wmOffY) * (newScale / wmScale);
  wmScale = newScale;
  wmApplyTransform();
}

function wmProvAt(mx, my) {
  const mapX = Math.floor((mx - wmOffX) / (wmScale * wmFitScale));
  const mapY = Math.floor((my - wmOffY) / (wmScale * wmFitScale));
  if (mapX < 0 || mapX >= MAP_W || mapY < 0 || mapY >= MAP_H) return 0;
  const k = (mapY * MAP_W + mapX) * 4;
  return (mapIdData[k] << 8) | mapIdData[k + 1];
}

function wmSetupInteraction(wrap) {
  if (wmHandlersSet) return;
  wmHandlersSet = true;
  let dragging = false, lastX, lastY, didDrag = false;

  wrap.addEventListener('mousedown', (e) => {
    dragging = true; didDrag = false;
    lastX = e.clientX; lastY = e.clientY;
  });
  wrap.addEventListener('mousemove', (e) => {
    const rect = wrap.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    if (dragging) {
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) didDrag = true;
      wmOffX += dx; wmOffY += dy;
      lastX = e.clientX; lastY = e.clientY;
      wmApplyTransform();
      return;
    }
    if (!mapIdData || !wmOwnerByPid) return;
    const pid = wmProvAt(mx, my);
    const tt = document.getElementById('world-map-tooltip');
    if (!tt) return;
    const ci = pid > 0 ? wmOwnerByPid[pid] : -1;
    let label = '';
    if (ci >= 0) {
      const tag = wmTags[ci];
      label = (DATA[tag] ? DATA[tag].name : tag);
      const pname = PROVINCES[String(pid)];
      if (pname) label += ' • ' + pname;
    } else if (pid > 0 && PROVINCES[String(pid)]) {
      // Only colonizable land has province details; seas and wastelands don't
      label = PROVINCES[String(pid)] + (PROV_DETAILS[String(pid)] ? ' • uncolonized' : '');
    }
    if (label) {
      tt.textContent = label;
      tt.style.display = 'block';
      tt.style.left = (mx + 12) + 'px';
      tt.style.top = (my - 8) + 'px';
    } else {
      tt.style.display = 'none';
    }
  });
  wrap.addEventListener('mouseup', () => { dragging = false; });
  wrap.addEventListener('mouseleave', () => {
    dragging = false;
    const tt = document.getElementById('world-map-tooltip');
    if (tt) tt.style.display = 'none';
  });

  wrap.addEventListener('click', (e) => {
    if (didDrag) return;
    const rect = wrap.getBoundingClientRect();
    const pid = wmProvAt(e.clientX - rect.left, e.clientY - rect.top);
    const ci = pid > 0 ? wmOwnerByPid[pid] : -1;
    if (ci >= 0 && DATA[wmTags[ci]]) selectCountry(wmTags[ci]);
  });

  wrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    const newScale = Math.max(0.8, Math.min(20, wmScale * factor));
    wmOffX = mx - (mx - wmOffX) * (newScale / wmScale);
    wmOffY = my - (my - wmOffY) * (newScale / wmScale);
    wmScale = newScale;
    wmApplyTransform();
  }, { passive: false });

  addPinchZoom(wrap, {
    min: 0.8, max: 20,
    getScale: () => wmScale,
    getOff: () => [wmOffX, wmOffY],
    set: (s, x, y) => { wmScale = s; wmOffX = x; wmOffY = y; wmApplyTransform(); }
  });
}

// Two-finger pan + pinch zoom for touch devices; one finger keeps scrolling the page
function addPinchZoom(el, st) {
  let pinch = null;
  const mid = (e, rect) => ({
    dist: Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY),
    x: (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left,
    y: (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top
  });
  el.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      e.preventDefault();
      pinch = mid(e, el.getBoundingClientRect());
    }
  }, { passive: false });
  el.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 2 || !pinch) return;
    e.preventDefault();
    const m = mid(e, el.getBoundingClientRect());
    const scale = st.getScale();
    const newScale = Math.max(st.min, Math.min(st.max, scale * (m.dist / pinch.dist)));
    const off = st.getOff();
    const nx = pinch.x - (pinch.x - off[0]) * (newScale / scale) + (m.x - pinch.x);
    const ny = pinch.y - (pinch.y - off[1]) * (newScale / scale) + (m.y - pinch.y);
    st.set(newScale, nx, ny);
    pinch = m;
  }, { passive: false });
  el.addEventListener('touchend', (e) => { if (e.touches.length < 2) pinch = null; });
  el.addEventListener('touchcancel', () => { pinch = null; });
}

function scheduleWorldMapRender() {
  const welcome = document.getElementById('welcome');
  if (!welcome || welcome.style.display === 'none') { wmDirty = true; return; }
  clearTimeout(wmTimer);
  wmTimer = setTimeout(renderWorldMap, 200);
}

function showWorldMap() {
  document.getElementById('detail').className = '';
  document.getElementById('welcome').style.display = '';
  selectedTag = null;
  document.querySelectorAll('.country-item').forEach(el => el.classList.remove('selected'));
  if (!wmRendered || wmDirty) renderWorldMap();
}

// Init
document.addEventListener('DOMContentLoaded', loadData);
</script>
